[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Production API Reverse Proxy (routes /api requests to Render backend)
[[redirects]]
  from = "/api/*"
  to = "https://fsd-cse-21.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
